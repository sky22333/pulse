[package]
name = "pulse"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = "=0.9.0"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Performance", "Win32_System_LibraryLoader", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
realfft = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
gpui-test = { package = "gpui-pre", version = "=0.3.11", features = ["test-support"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true




[build-dependencies]
embed-resource = "3.0.12"
